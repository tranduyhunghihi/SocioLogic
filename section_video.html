<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Section Video Full Screen - SocioLogic</title>
    
    <!-- Link Stylesheet -->
    <link rel="stylesheet" href="css/section_video.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }
        .fullscreen-video-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 99999;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-video-player {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            display: block !important;
        }
    </style>
</head>
<body style="margin:0; padding:0; background:#000; overflow:hidden; width:100vw; height:100vh;">

    <!-- ==========================================================================
         FULLSCREEN VIDEO SECTION (CHỈ CHỨA VIDEO FULL SCREEN TRÀN 100% MÀN HÌNH)
         ========================================================================== -->
    <section class="fullscreen-video-section" id="section-video" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000; z-index:99999; overflow:hidden;">
        <video 
            class="fullscreen-video-player" 
            style="width:100vw; height:100vh; object-fit:contain; display:block; border:none; outline:none; cursor:pointer;"
            loop 
            playsinline 
            controls
            poster="assets/video/thumb.jpg">
            <!-- 💡 THAY VIDEO MẪU TẠI ĐÂY: Thay src bên dưới bằng file video mp4 của bạn (ví dụ: assets/videos/socio_logic.mp4) -->
            <source src="https://assets.mixkit.co/videos/preview/mixkit-set-of-plateaus-seen-from-the-sky-in-a-sunset-26070-large.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ thẻ video HTML5.
        </video>
    </section>

</body>
</html>
