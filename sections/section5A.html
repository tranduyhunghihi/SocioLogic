<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section 5A - Những Gương Mặt SocioLogic | SocioLogic</title>
    <link rel="stylesheet" href="../css/section5A.css">
</head>
<body>

    <section class="section-5a-wrapper" id="section-5a">
        <div class="section-container">

            <!-- 1. Header Row (2 Columns) -->
            <div class="section-header">
                <h2 class="header-title-left">B. Những Gương Mặt SocioLogic</h2>
                <h2 class="header-title-right">Cộng Đồng Là Những Con Người Cùng Kiến Tạo.</h2>
            </div>

            <!-- 2. Word 1 Banner: SOCIO (5 Speech Bubbles) -->
            <div class="bubbles-row row-socio">
                
                <!-- 1. Letter S (Blue) -->
                <div class="bubble-item letter-1-S" title="S">
                    <img src="assets/section5/1_S_blue.png" alt="Bubble S" class="bubble-bg">
                    <span class="bubble-letter">S</span>
                </div>

                <!-- 2. Letter o (Cyan) -->
                <div class="bubble-item letter-2-o" title="o">
                    <img src="assets/section5/2_o_cyan.png" alt="Bubble o" class="bubble-bg">
                    <span class="bubble-letter">o</span>
                </div>

                <!-- 3. Letter c (Green) -->
                <div class="bubble-item letter-3-c" title="c">
                    <img src="assets/section5/3_c_green.png" alt="Bubble c" class="bubble-bg">
                    <span class="bubble-letter">c</span>
                </div>

                <!-- 4. Letter i (Yellow) -->
                <div class="bubble-item letter-4-i" title="i">
                    <img src="assets/section5/4_i_yellow.png" alt="Bubble i" class="bubble-bg">
                    <span class="bubble-letter">i</span>
                </div>

                <!-- 5. Letter o (Orange) -->
                <div class="bubble-item letter-5-o" title="o">
                    <img src="assets/section5/5_o_orange.png" alt="Bubble o" class="bubble-bg">
                    <span class="bubble-letter">o</span>
                </div>

            </div>

            <!-- 3. Subtitle Paragraph 1 -->
            <div class="subtitle-block block-1">
                <p>Là Cộng Đồng, Là Những Con Người Cùng Gặp Gỡ Và Kiến Tạo</p>
                <p>Nên Không Gian Của Tư Duy Và Tiếng Nói.</p>
            </div>

            <!-- 4. Word 2 Banner: LOGIC (5 Speech Bubbles) -->
            <div class="bubbles-row row-logic">

                <!-- 6. Letter L (Red-Orange) -->
                <div class="bubble-item letter-6-L" title="L">
                    <img src="assets/section5/6_L_redorange.png" alt="Bubble L" class="bubble-bg">
                    <span class="bubble-letter">L</span>
                </div>

                <!-- 7. Letter o (Pink) -->
                <div class="bubble-item letter-7-o" title="o">
                    <img src="assets/section5/7_o_pink.png" alt="Bubble o" class="bubble-bg">
                    <span class="bubble-letter">o</span>
                </div>

                <!-- 8. Letter g (Grey) -->
                <div class="bubble-item letter-8-g" title="g">
                    <img src="assets/section5/8_g_grey.png" alt="Bubble g" class="bubble-bg">
                    <span class="bubble-letter">g</span>
                </div>

                <!-- 9. Letter i (Cyan) -->
                <div class="bubble-item letter-9-i" title="i">
                    <img src="assets/section5/9_i_cyan.png" alt="Bubble i" class="bubble-bg">
                    <span class="bubble-letter">i</span>
                </div>

                <!-- 10. Letter c (Blue) -->
                <div class="bubble-item letter-10-c" title="c">
                    <img src="assets/section5/10_c_blue.png" alt="Bubble c" class="bubble-bg">
                    <span class="bubble-letter">c</span>
                </div>

            </div>

            <!-- 5. Subtitle Paragraph 2 -->
            <div class="subtitle-block block-2">
                <p>Là Sự Liên Kết, Là Khả Năng Đặt Câu Hỏi, Tư Duy Nhìn Nhận Và</p>
                <p>Kết Nối Những Góc Nhìn Khác Nhau.</p>
            </div>

        </div>
    </section>

</body>
</html>
