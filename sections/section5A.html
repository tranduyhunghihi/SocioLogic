    <!-- Scroll Intersection Observer & Eye Tracking JS Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Scroll Intersection Observer for Background Animation
            const sec5a = document.getElementById('section-5a');
            if (sec5a && 'IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                        } else {
                            entry.target.classList.remove('is-visible');
                        }
                    });
                }, { threshold: 0.15 });
                observer.observe(sec5a);
            }

            // 2. Real-Time Proximity-Based Eye Tracking Engine (100% Synced with Section Mix)
            const PROXIMITY_THRESHOLD = 500;
            const MAX_PUPIL_SHIFT = 11.0;

            let mouseX = -9999;
            let mouseY = -9999;
            let ticking = false;

            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;

                if (!ticking) {
                    requestAnimationFrame(updateEyes5A);
                    ticking = true;
                }
            });

            function updateEyes5A() {
                ticking = false;

                const container = document.getElementById('bubblesContainerSec5a') || document.querySelector('.sec5a-bubbles-viewport .bubbles-row');
                if (!container) return;

                const bubbles = container.querySelectorAll('.bubble-item');
                bubbles.forEach((bubble) => {
                    const rect = bubble.getBoundingClientRect();
                    const bubbleCenterX = rect.left + rect.width / 2;
                    const bubbleCenterY = rect.top + rect.height / 2;

                    const deltaX = mouseX - bubbleCenterX;
                    const deltaY = mouseY - bubbleCenterY;
                    const distance = Math.hypot(deltaX, deltaY);

                    const pupils = bubble.querySelectorAll('.pupil');

                    if (distance < PROXIMITY_THRESHOLD) {
                        bubble.classList.add('active-near');

                        pupils.forEach((pupil) => {
                            const pupilRect = pupil.getBoundingClientRect();
                            const pupilCenterX = pupilRect.left + pupilRect.width / 2;
                            const pupilCenterY = pupilRect.top + pupilRect.height / 2;

                            const angle = Math.atan2(mouseY - pupilCenterY, mouseX - pupilCenterX);
                            const proximityFactor = Math.pow(1 - (distance / PROXIMITY_THRESHOLD), 0.7);
                            const shift = Math.min(MAX_PUPIL_SHIFT, proximityFactor * MAX_PUPIL_SHIFT);

                            const shiftX = Math.cos(angle) * shift;
                            const shiftY = Math.sin(angle) * shift;

                            pupil.style.transform = `translate(${shiftX.toFixed(2)}px, ${shiftY.toFixed(2)}px)`;
                        });
                    } else {
                        bubble.classList.remove('active-near');
                        pupils.forEach((pupil) => {
                            pupil.style.transform = 'translate(0px, 0px)';
                        });
                    }
                });
            }

            document.addEventListener('mouseleave', () => {
                const container = document.getElementById('bubblesContainerSec5a') || document.querySelector('.sec5a-bubbles-viewport .bubbles-row');
                if (!container) return;
                const bubbles = container.querySelectorAll('.bubble-item');
                bubbles.forEach((bubble) => {
                    bubble.classList.remove('active-near');
                    const pupils = bubble.querySelectorAll('.pupil');
                    pupils.forEach((pupil) => {
                        pupil.style.transform = 'translate(0px, 0px)';
                    });
                });
            });
        });
    </script>
