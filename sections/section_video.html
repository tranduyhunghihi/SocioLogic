<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Section Video Full Screen - SocioLogic</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="shortcut icon" type="image/png" href="../assets/favicon.png">

    <!-- Link Stylesheets -->
    <link rel="stylesheet" href="../css/section_video.css">
    <link rel="stylesheet" href="css/section_video.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }
        .fullscreen-video-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 99999;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-video-player {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            display: block !important;
        }
    </style>
</head>
<body style="margin:0; padding:0; background:#000; overflow:hidden; width:100vw; height:100vh;">

    <!-- ==========================================================================
         FULLSCREEN VIDEO SECTION (CHỈ CHỨA VIDEO FULL SCREEN TRÀN 100% MÀN HÌNH)
         ========================================================================== -->
    <section class="fullscreen-video-section" id="section-video" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000; z-index:99999; overflow:hidden;">
        <video 
            class="fullscreen-video-player" 
            style="width:100vw; height:100vh; object-fit:contain; display:block; border:none; outline:none; cursor:pointer;"
            loop 
            playsinline 
            controls
            poster="../assets/video/thumb.jpg">
            <source src="https://drive.google.com/uc?export=download&id=1qUk5uV3sl3JlDEcN1iEe4EU4U4fMt0JC" type="video/mp4">
            <source src="https://docs.google.com/uc?export=download&id=1qUk5uV3sl3JlDEcN1iEe4EU4U4fMt0JC" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ thẻ video HTML5.
        </video>
        <div class="video-play-btn-overlay">
            <div class="video-play-btn-circle">
                <svg class="video-play-svg" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="44" fill="#FFFFFF" stroke="#0052FF" stroke-width="4.5"/>
                    <polygon points="39,30 71,50 39,70" fill="none" stroke="#0052FF" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    </section>

</body>
</html>
