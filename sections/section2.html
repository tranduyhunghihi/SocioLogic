    <link rel="stylesheet" href="../css/section2.css">

<body>

    <section class="section-banner">

        <div class="bubbles-viewport">
            <div class="bubbles-row">

                <!-- FLOATING DOODLES -->
                <img src="../assets/section2/icon_podium.png" alt="Podium Icon" class="img-doodle doodle-top-1">
                <img src="../assets/section2/icon_book.png" alt="Book Icon" class="img-doodle doodle-top-2">
                <img src="../assets/section2/icon_question.png" alt="Question Icon" class="img-doodle doodle-top-3">
                <img src="../assets/section2/icon_medal.png" alt="Medal Icon" class="img-doodle doodle-top-4">

                <img src="../assets/section2/icon_book.png" alt="Book Icon" class="img-doodle doodle-bottom-4">

                <!-- 1. Letter S (Blue) -->
                <div class="bubble-item letter-1-S" data-index="1" title="S">
                    <img src="../assets/section2/1_S_blue.png" alt="Bubble S" class="bubble-bg">
                    <span class="bubble-letter">S</span>
                    <div class="bubble-face face-S">
                        <div class="eyes-row">
                            <div class="eye eye-left"><div class="pupil pupil-always"></div></div>
                            <div class="mouth mouth-svg-smile">
                                <svg viewBox="0 0 26 20" width="25" height="18">
                                    <path d="M 4 4 C 4 16, 22 16, 22 4" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
                                </svg>
                            </div>
                            <div class="eye eye-right"><div class="pupil pupil-always"></div></div>
                        </div>
                    </div>
                </div>

                <!-- 2. Letter o (Cyan) -->

                    <div class="bubble-face face-o1">
                        <div class="eyes-row">
                            <div class="eye eye-left">
                                <div class="pupil"></div>
                                <div class="eye-idle-svg">
                                    <svg viewBox="0 0 22 14" width="22" height="14">
                                        <path d="M 3 11 C 3 3, 19 3, 19 11" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" />
                                    </svg>
                                </div>
                            </div>
                            <div class="mouth mouth-svg-open">
                                <svg viewBox="0 0 24 24" width="20" height="20">
                                    <circle cx="12" cy="12" r="9.5" fill="#FFFFFF" />
                                </svg>
                            </div>
                            <div class="eye eye-right">
                                <div class="pupil"></div>
                                <div class="eye-idle-svg">
                                    <svg viewBox="0 0 22 14" width="22" height="14">
                                        <path d="M 3 11 C 3 3, 19 3, 19 11" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
